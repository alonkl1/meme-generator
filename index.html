<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alon's meme generator (the best)</title>
</head>

<body>
    <section class="editor">
        <div class="canvas">
            <canvas width="500" height="500">
            </canvas>
        </div>

        <div class="controls">
            <input type="text" id="text-input" placeholder="Enter meme text">
            <button id="switch-line-btn">Switch Line</button>
            <button id="add-line-btn">Add Line</button>
            <button id="delete-line-btn">Delete Line</button>
            <div class="color-wrapper">
                <label>Text Color</label>
                <input type="color" id="color-input" value="#ff0000">
            </div>

            <div>
                <button id="font-size-increase">Font size +</button>
                <button id="font-size-decrease">Font size -</button>
            </div>


            <button id="download-btn">Download</button>
        </div>


    </section>

    <section class="gallery" id="gallery"></section>

    <script src="Service/meme-service.js"></script>
    <script src="meme-controller.js"></script>
    <script src="gallery-controller.js"></script>
    <script src="main.js"></script>

    <link rel="stylesheet" href="styles.css">
</body>

</html>
